document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ero\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px 80px;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px;align-items:center\">\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"font-family:var(--font-mono);font-size:13px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)\">Local tech help · we come to you<\u002Fdiv>\n    <h1 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(46px,6vw,72px);line-height:1;letter-spacing:var(--tracking-display);text-wrap:balance\">Computer acting up? We'll come take a look.<\u002Fh1>\n    <p style=\"margin:0;font-size:var(--text-body-l);line-height:var(--lh-body-l);color:var(--text-muted);max-width:500px;text-wrap:pretty\">Repairs, Wi-Fi that reaches every room, cameras, smart home gear and the cables behind it all. Explained in plain English, priced before we start.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:8px\">\n      <a href=\"#contact\" style=\"background:var(--accent);color:var(--text-on-accent);font-weight:600;font-size:16px;padding:14px 22px;border-radius:var(--radius-sm)\">Book a visit<\u002Fa>\n      <a href=\"#services\" style=\"border:1.5px solid var(--text-primary);font-weight:600;font-size:16px;padding:13px 22px;border-radius:var(--radius-sm)\">See services<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"aspect-ratio:4/5;max-height:600px;width:100%\">\n    <image-slot id=\"hero-photo\" shape=\"rounded\" radius=\"8\" placeholder=\"Photo of you at work: at a desk, under a router, in someone's living room\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<section id=\"services\" data-screen-label=\"Services\" style=\"border-top:1px solid var(--border-subtle)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:80px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:12px;max-width:600px\">\n        <div style=\"font-family:var(--font-mono);font-size:13px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)\">Services<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-display-l);line-height:var(--lh-display-l);letter-spacing:var(--tracking-display)\">What can we help with?<\u002Fh2>\n      <\u002Fdiv>\n      <div role=\"tablist\" style=\"display:flex;gap:4px;padding:4px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-card)\">\n        <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ showHome }}\" style=\"font-family:var(--font-body);font-weight:600;font-size:15px;padding:10px 20px;border:none;border-radius:var(--radius-sm);cursor:pointer;background:{{ homeBg }};color:{{ homeFg }};transition:background var(--dur-fast) var(--ease-standard)\">At home<\u002Fbutton>\n        <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ showBiz }}\" style=\"font-family:var(--font-body);font-weight:600;font-size:15px;padding:10px 20px;border:none;border-radius:var(--radius-sm);cursor:pointer;background:{{ bizBg }};color:{{ bizFg }};transition:background var(--dur-fast) var(--ease-standard)\">For business<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px\">\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Computer repair<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Slow, won't start, strange pop-ups, a cracked screen. We find the cause and fix it, or tell you honestly when it's time for a new one.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Home Wi-Fi &amp; networks<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Dead spots in the bedroom, buffering in the basement. We set up a network that covers the whole house.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Cable installation<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Ethernet run through walls and ceilings to the office, the TV or the game room. Tidy, labeled, no cables across the floor.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Smart home<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Lights, thermostats, doorbells and speakers that work together, and that you know how to use.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Security cameras<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Cameras mounted, wired and pointed at what matters, with an app on your phone to check in from anywhere.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Game server hosting<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">A server for your friends' Minecraft or Valheim world. Mods installed, saves backed up, always on.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Website hosting<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">A home for your blog, portfolio or side project. We run it, patch it and keep it backed up.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Domains<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Your own name online, like yourname.com. Registered, renewed and pointed where it needs to go.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Buying advice<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">New laptop, router or camera? Tell us what you need and we'll point you to what's worth the money.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBiz }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px\">\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Small business servers<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">File sharing, backups and user accounts on a server sized for your office, set up and handed over with notes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Server hardware repair<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Failed drives, power supplies, memory and boards diagnosed and replaced.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Office networks &amp; cameras<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Wi-Fi that covers every desk, and security cameras on the doors, the lot and the stockroom.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Cabling &amp; fiber<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">New runs for the office, plus fiber troubleshooting when a link goes dark or drops packets.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Web hosting &amp; domains<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Your website hosted, patched and backed up. Domains and DNS looked after so nothing expires by surprise.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Procurement<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Quotes compared and hardware chosen for what you actually do, not what the reseller wants to sell.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">Rack diagrams &amp; cable maps<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">A clear picture of what's plugged into what, so the next person isn't guessing.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">SOPs &amp; runbooks<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Step-by-step procedures written for your setup: onboarding, backups, what to do when it breaks.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading);letter-spacing:var(--tracking-display)\">On-site help for remote IT<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Your IT team is elsewhere; we're nearby. Reboots, part swaps, console access and a look at the blinking lights.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"area\" data-screen-label=\"Service area\" style=\"background:var(--bg-inverse);color:var(--text-inverse)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:80px 32px;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-family:var(--font-mono);font-size:13px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--accent-on-light)\">Where we work<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-display-l);line-height:var(--lh-display-l);letter-spacing:var(--tracking-display);text-wrap:balance\">Chicagoland &amp; Northwest Indiana<\u002Fh2>\n      <p style=\"margin:0;font-size:var(--text-body-l);line-height:var(--lh-body-l);color:#4F5755;max-width:440px\">House and office calls anywhere in the highlighted area on the map. Hosting and remote fixes work from anywhere.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 24px;font-size:16px;max-width:440px\">\n        <span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);font-weight:600\">Cook Co., IL<\u002Fspan><span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);color:#4F5755\">Chicago<\u002Fspan>\n        <span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);font-weight:600\">Lake Co., IN<\u002Fspan><span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);color:#4F5755\">Hammond<\u002Fspan>\n        <span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);font-weight:600\">Porter Co., IN<\u002Fspan><span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);color:#4F5755\">Portage<\u002Fspan>\n        <span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);border-bottom:1px solid var(--lt-fog-200);font-weight:600\">La Porte Co., IN<\u002Fspan><span style=\"padding:12px 0;border-top:1px solid var(--lt-fog-200);border-bottom:1px solid var(--lt-fog-200);color:#4F5755\">Michigan City<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:#4F5755\">Not sure if you're in range? <a href=\"#contact\" style=\"color:var(--accent-on-light);font-weight:600\">Just ask.<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <img src=\"34f63701-2b3f-403f-a98a-52a24475c4b2\" alt=\"Service area map: Cook County IL, and Lake, Porter and La Porte Counties IN\" style=\"display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-lg)\">\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:start\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"font-family:var(--font-mono);font-size:13px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)\">Book a visit<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-display-l);line-height:var(--lh-display-l);letter-spacing:var(--tracking-display);text-wrap:balance\">Tell us what's going on.<\u002Fh2>\n    <p style=\"margin:0;font-size:var(--text-body-l);line-height:var(--lh-body-l);color:var(--text-muted);max-width:440px\">The more detail, the faster the fix. Tell us what you were doing when it happened, copy any error message word for word (a photo of the screen works too), and when it started. We'll reply with a time and a price before any work starts.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:8px;font-size:16px\">\n      <a href=\"{{ mailHref }}\" style=\"color:var(--text-primary);font-weight:600\" style-hover=\"color:var(--accent)\">{{ email }}<\u002Fa>\n      <sc-if value=\"{{ hasPhone }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ telHref }}\" style=\"color:var(--text-primary);font-weight:600\" style-hover=\"color:var(--accent)\">{{ phone }}<\u002Fa><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:32px\">\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <div ref=\"{{ formRef }}\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <x-import component-from-global-scope=\"LighthouseTechsDesignSystem_84d7b7.Input\" label=\"Your name\" placeholder=\"Maya Chen\" hint-size=\"100%,72px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"LighthouseTechsDesignSystem_84d7b7.Input\" label=\"Email or phone\" placeholder=\"maya@email.com\" hint-size=\"100%,72px\"><\u002Fx-import>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-family:var(--font-body)\">\n          <span style=\"font-size:14px;font-weight:600;color:var(--text-primary)\">What's going on?<\u002Fspan>\n          <textarea rows=\"7\" placeholder=\"What were you doing when it happened? Any error message, word for word? When did it start? Example: Outlook shows 'Cannot start Microsoft Outlook' every time I open it. Started Monday morning after a Windows update.\" style=\"font-family:inherit;font-size:16px;line-height:1.5;padding:11px 14px;border-radius:var(--radius-sm);background:var(--bg-page);color:var(--text-primary);outline:none;border:1px solid var(--border-strong);resize:vertical;min-height:180px\" style-focus=\"border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch, var(--accent) 25%, transparent)\"><\u002Ftextarea>\n          <span style=\"font-size:13px;color:var(--text-muted)\">Screenshots or a phone photo of the screen help a lot. Attach them when we reply.<\u002Fspan>\n        <\u002Flabel>\n        <div style=\"display:flex\">\n          <x-import component-from-global-scope=\"LighthouseTechsDesignSystem_84d7b7.Button\" size=\"lg\" sc-camel-on-click=\"{{ send }}\" hint-size=\"160px,50px\">Send request<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-heading);line-height:var(--lh-heading)\">Your email app should open with the request filled in. Hit send there.<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.6;color:var(--text-muted)\">Nothing opened? Email us at <a href=\"{{ mailHref }}\" style=\"color:var(--accent);font-weight:600\">{{ email }}<\u002Fa>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid var(--border-subtle)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:32px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n    <x-import component-from-global-scope=\"LighthouseTechsDesignSystem_84d7b7.Wordmark\" size=\"18\" hint-size=\"160px,28px\"><\u002Fx-import>\n    <span style=\"font-family:var(--font-mono);font-size:13px;color:var(--text-muted)\">Look for the beacon.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;lighthouseUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;lh.nounverb.net&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wikiUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;w.nounverb.net&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;requests@nounverb.net&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactPhone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;business&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'business'&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: null, sent: false };\n  formRef = React.createRef();\n  fixUrl(u) { if (!u || u === '#') return '#'; return /^(https?:|mailto:|#|\\/)/.test(u) ? u : 'https://' + u; }\n  submit() {\n    const el = this.formRef.current, email = this.props.contactEmail || 'requests@nounverb.net';\n    const ins = el ? [...el.querySelectorAll('input')].map(i => i.value.trim()) : [];\n    const msg = el?.querySelector('textarea')?.value.trim() || '';\n    const [name = '', reach = ''] = ins;\n    const subject = 'Service request' + (name ? ' from ' + name : '');\n    const body = 'Name: ' + name + '\\nContact: ' + reach + '\\n\\n' + msg;\n    window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);\n    this.setState({ sent: true });\n  }\n  renderVals() {\n    const tab = this.state.tab ?? this.props.defaultTab ?? 'home';\n    const on = { bg: 'var(--accent)', fg: 'var(--text-on-accent)' };\n    const off = { bg: 'transparent', fg: 'var(--text-muted)' };\n    const h = tab === 'home' ? on : off, b = tab === 'home' ? off : on;\n    return {\n      isHome: tab === 'home', isBiz: tab === 'business',\n      homeBg: h.bg, homeFg: h.fg, bizBg: b.bg, bizFg: b.fg,\n      showHome: () => this.setState({ tab: 'home' }),\n      showBiz: () => this.setState({ tab: 'business' }),\n      sent: this.state.sent, notSent: !this.state.sent,\n      send: () => this.submit(),\n      lighthouseUrl: this.fixUrl(this.props.lighthouseUrl ?? 'lh.nounverb.net'), wikiUrl: this.fixUrl(this.props.wikiUrl ?? 'w.nounverb.net'), formRef: this.formRef,\n      email: this.props.contactEmail || 'requests@nounverb.net',\n      mailHref: 'mailto:' + (this.props.contactEmail || 'requests@nounverb.net'),\n      phone: this.props.contactPhone || '', hasPhone: !!this.props.contactPhone,\n      telHref: 'tel:' + (this.props.contactPhone || '').replace(/[^\\d+]/g, '')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
